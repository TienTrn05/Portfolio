server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Preserve the resume URL supported by the existing Vercel configuration.
    location = /assets/TranNgocTien_Resume.pdf {
        rewrite ^ /assets/Tranngoctien_resume.pdf last;
    }

    # Missing static files must return 404 instead of the SPA HTML document.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
